version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  # Backend Service
  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/employeeDB
      - JWT_SECRET=${JWT_SECRET} 
    depends_on:
      - mongodb
    networks:
      - mern-network

  # Frontend Service
  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "3000:80" 
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data: