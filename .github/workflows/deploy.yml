name: MERN Stack CI/CD Pipeline

on:
  push:
    branches: [ main ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend

  deploy:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest
            
            docker stop mern-backend mern-frontend || true
            docker rm mern-backend mern-frontend || true
            
            docker run -d --name mern-backend -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
            docker run -d --name mern-frontend -p 3000:80 ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest
            
            docker image prune -f
