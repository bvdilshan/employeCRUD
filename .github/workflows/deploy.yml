name: MERN Stack CI/CD Pipeline

on:
  push:
    branches: [ main ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend

  deploy:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/my-mern-app
            docker-compose pull
            docker-compose up -d
            docker image prune -f 